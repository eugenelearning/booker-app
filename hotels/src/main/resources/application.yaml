springdoc:
  api-docs:
    path: /api-docs
spring:
  application:
    name: hotels
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: ${JWT_ISSUER_URI}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: none
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_URI}
management:
  tracing:
    sampling:
      probability: 1
  zipkin:
    tracing:
      endpoint: ${TRACE_ENDPOINT_URI}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info