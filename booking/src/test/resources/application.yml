spring:
  application:
    name: booking
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: ${JWT_ISSUER_URI}
  datasource:
    url: jdbc:h2:mem:testing-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: test
    password: test
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
server:
  port: 8083